name: conviva_app
description: Conviva - Facebook-based "fake" login demo (no backend, name pulled from Facebook profile).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_facebook_auth: ^7.1.1
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
